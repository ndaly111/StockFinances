name: Refresh site (weekly)

# Full pipeline: refreshes historical financials, balance sheet, segments,
# expense reports, EDGAR backfill, and the index-growth historical rebuilds.
# Runs Sundays (so Monday's daily refresh has fresh historicals to read
# from). The daily workflow handles everything else weekdays — see
# site-refresh-daily.yml.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 0"      # 8:00 AM EST Sunday — once a week, full pipeline

permissions:
  contents: write
  issues: write   # file/append a CI-failure issue (see last step)

concurrency:
  group: site-refresh
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MODE: weekly
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      SEC_EMAIL: ${{ secrets.EMAIL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Shallow: nothing in this job reads git history, and we only push to
          # gh-pages (below), never to main. Full history of a repo with a 22MB
          # binary DB committed thousands of times was ~3.5 min to fetch.
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate pages
        run: |
          python main_remote.py
          python generate_market_summary.py
          python scripts/dump_assumptions.py

      - name: Generate ticker JSONs (shell data)
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
          GEN_WORKERS: "1"   # sequential: parallel build rate-limits yfinance/scrape at 102-ticker scale (4/102 built). Revisit with backoff before re-enabling.
        run: |
          TICKERS=$(tail -n +2 tickers.csv | tr -d '\r' | tr '\n' ' ')
          # No "|| true": gen_ticker_json exits nonzero if too many tickers fail
          # (GEN_FAIL_TOLERANCE). This also guards the weekly rsync below, which
          # --deletes without a ticker_data count check — a catastrophic build
          # now fails here instead of wiping live JSONs.
          python scripts/gen_ticker_json.py $TICKERS

      - name: Check out gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          # Shallow: we only rsync + commit the latest tree; gh-pages history
          # isn't needed and was ~3.5 min to fetch (same lesson as
          # update-assumptions.yml). The push works fine from a depth-1 clone.
          fetch-depth: 1

      - name: Copy site output into gh-pages
        run: |
          # Exclude artifacts owned by other workflows so this --delete
          # doesn't race-wipe them. screen-microcaps writes microcaps.html
          # + data/microcap_candidates*.csv on its own cadence.
          rsync -av --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "gh-pages" \
            --exclude "microcaps.html" \
            --exclude "data/microcap_candidates*.csv" \
            --exclude "data/microcap_appearances.json" \
            --exclude "charts/microcap_thesis_*.png" \
            --exclude "charts/microcap/" \
            ./ gh-pages/

      - name: Commit & push changes to gh-pages
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Deploy to GitHub Pages"
            git push origin gh-pages
          fi

      # DB persistence trial (Phase 1, ADDITIVE — see site-refresh-daily). The
      # Sunday run persists the full weekly-rebuilt DB (TTM/Annual/balance sheet)
      # to the `data` branch. Additive + continue-on-error; consumers still read
      # main until the proven flip.
      - name: Persist DB to data branch (trial)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 -b data \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" dbpush
          cp "Stock Data.db" dbpush/
          cd dbpush
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Stock Data.db"
          if git diff --cached --quiet; then
            echo "DB unchanged — nothing to persist."
          else
            git commit -m "db: weekly refresh"
            git push origin HEAD:data
          fi

      - name: File failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="CI failure: ${{ github.workflow }}"
          URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          N=$(gh issue list --state open --limit 100 --json number,title \
                --jq "[.[] | select(.title==\"$TITLE\")][0].number // empty")
          if [ -n "$N" ]; then
            gh issue comment "$N" --body "Failed again: $URL"
          else
            gh issue create --title "$TITLE" --body "Workflow failed: $URL"
          fi
