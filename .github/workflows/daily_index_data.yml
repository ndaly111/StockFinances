name: Daily Index Data Collection

# Phase 1 Stage C: schedule RETIRED. The post-close index snapshot is now
# collected inside site-refresh-daily.yml's evening run (single data-branch
# writer at 21:30 → no push race). Kept dispatch-only as a manual backstop;
# it hydrates from + persists to the data branch like the refresh workflows.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-index-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Phase 1 Stage C: the DB lives on the `data` branch, not main.
      - name: Hydrate DB from data branch
        run: |
          git fetch --depth 1 origin data
          git restore --source=origin/data --worktree -- "Stock Data.db"
          test -s "Stock Data.db" || { echo "::error::DB hydrate failed/empty"; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas requests beautifulsoup4

      - name: Collect daily index data
        run: |
          python scripts/collect_daily_index_data.py --tickers SPY QQQ

      - name: Backfill implied growth from P/E history
        run: |
          python backfill_index_growth.py || echo "Backfill growth failed, continuing..."

      # Persist the index-table writes to the data branch (not main). On a push
      # race (this shares the 21:30 cron with the evening site-refresh, which
      # writes DISJOINT tables), re-hydrate the winner's tip and re-run our
      # idempotent index writers on top, then retry — never clobber.
      - name: Persist DB to data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SZ=$(stat -c%s "Stock Data.db" 2>/dev/null || echo 0)
          if [ "$SZ" -lt 10000000 ]; then echo "::error::DB only $SZ bytes — refusing to persist"; exit 1; fi
          ok=0
          for attempt in 1 2 3 4 5; do
            rm -rf dbpush
            git clone --depth 1 -b data \
              "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" dbpush
            cp "Stock Data.db" dbpush/
            cd dbpush
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "Stock Data.db"
            if git diff --cached --quiet; then echo "DB unchanged."; cd ..; ok=1; break; fi
            git commit -m "data: daily index update"
            if git push origin HEAD:data; then cd ..; ok=1; break; fi
            echo "push raced (attempt $attempt) — re-hydrate winner + re-run index writers"
            cd ..
            git fetch --depth 1 origin data
            git restore --source=origin/data --worktree -- "Stock Data.db"
            python scripts/collect_daily_index_data.py --tickers SPY QQQ || true
            python backfill_index_growth.py || true
          done
          [ "$ok" = "1" ] || { echo "::error::could not persist index DB after 5 attempts"; exit 1; }
