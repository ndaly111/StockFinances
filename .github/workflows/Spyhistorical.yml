name: Update Index PE & Growth History (Manual)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: index-history
  cancel-in-progress: true

jobs:
  update-index-history:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Phase 1 Stage C: the DB lives on the `data` branch, not main.
      - name: Hydrate DB from data branch
        run: |
          git fetch --depth 1 origin data
          git restore --source=origin/data --worktree -- "Stock Data.db"
          test -s "Stock Data.db" || { echo "::error::DB hydrate failed/empty"; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install requirements if file exists
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run index loader script
        run: |
          python scripts/load_sp500_index_series.py \
            --db "Stock Data.db" \
            --pe_csv "data/sp500_daily_pe_filled.csv" \
            --yield_csv "data/DGS10_filtered.csv"

      - name: Load SPY EPS history (monthly CSV)
        run: |
          python scripts/load_index_eps_csv.py \
            --db "Stock Data.db" \
            --csv "data/spy_monthly_eps_1970_present.csv" \
            --ticker "SPY" \
            --column "SPY_EPS" \
            --eps-type "TTM_REPORTED"

      - name: Load SPY monthly price history (monthly CSV)
        run: |
          python scripts/load_index_price_csv.py \
            --db "Stock Data.db" \
            --csv "data/spy_price_history_monthly_1993_present.csv" \
            --ticker "SPY" \
            --close-column "Close"

      - name: Derive monthly P/E from price and reported EPS
        run: |
          python scripts/derive_monthly_pe_from_price_and_eps.py \
            --db "Stock Data.db" \
            --ticker "SPY"

      - name: Generate index charts
        run: |
          python index_growth_charts.py SPY
          python index_growth_charts.py QQQ

      - name: Commit charts to main + persist DB to data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          # Charts still go to main; the DB now goes to the data branch (below).
          git add charts/*_chart.js charts/*_chart_div.html || true
          git add charts/spy_growth_chart.png charts/spy_pe_chart.png || true
          git add charts/spy_growth_summary.html charts/spy_pe_summary.html || true
          git add charts/qqq_growth_chart.png charts/qqq_pe_chart.png || true
          git add charts/qqq_growth_summary.html charts/qqq_pe_summary.html || true
          git add charts/*_eps_summary.html || true
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update: index PE & implied growth charts"
            git push
          fi
          # Persist the index-history DB writes to the data branch.
          SZ=$(stat -c%s "Stock Data.db" 2>/dev/null || echo 0)
          if [ "$SZ" -lt 10000000 ]; then echo "::error::DB only $SZ bytes — refusing to persist"; exit 1; fi
          ok=0
          for attempt in 1 2 3; do
            rm -rf dbpush
            git clone --depth 1 -b data \
              "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" dbpush
            cp "Stock Data.db" dbpush/
            cd dbpush
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add "Stock Data.db"
            if git diff --cached --quiet; then echo "DB unchanged."; cd ..; ok=1; break; fi
            git commit -m "data: index history backfill"
            if git push origin HEAD:data; then cd ..; ok=1; break; fi
            echo "push raced (attempt $attempt) — retry"; cd ..; sleep 3
          done
          [ "$ok" = "1" ] || { echo "::error::could not persist index DB"; exit 1; }
