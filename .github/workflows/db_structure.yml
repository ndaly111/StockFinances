name: Extract DB Structure

on:
  workflow_dispatch:

jobs:
  extract-structure:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    # Phase 1 Stage C: DB lives on the `data` branch (this job dumps its schema).
    - name: Hydrate DB from data branch
      run: |
        git fetch --depth 1 origin data
        git restore --source=origin/data --worktree -- "Stock Data.db"
        test -s "Stock Data.db" || { echo "::error::DB hydrate failed/empty"; exit 1; }

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.x

    - name: Install dependencies
      run: |
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run structure extractor
      run: python db_structure.py

    - name: Upload structure file
      uses: actions/upload-artifact@v4
      with:
        name: db_structure_output
        path: db_structure.txt
