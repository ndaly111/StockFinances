name: Monthly SPY Data Backfill

on:
  schedule:
    # Run on the 1st of each month at 6:00 AM UTC
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      source:
        description: 'Data source to use'
        required: true
        default: 'multpl'
        type: choice
        options:
          - multpl
          - stern
          - both

permissions:
  contents: write

concurrency:
  group: spy-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Phase 1 Stage C: the DB lives on the `data` branch, not main.
      - name: Hydrate DB from data branch
        run: |
          git fetch --depth 1 origin data
          git restore --source=origin/data --worktree -- "Stock Data.db"
          test -s "Stock Data.db" || { echo "::error::DB hydrate failed/empty"; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pandas requests beautifulsoup4 xlrd

      - name: Run Multpl backfill
        if: github.event.inputs.source != 'stern'
        run: |
          echo "Running Multpl.com backfill (monthly P/E data)..."
          python scripts/backfill_spy_from_multpl.py || echo "Multpl backfill failed, continuing..."

      - name: Run Stern backfill
        if: github.event.inputs.source == 'stern' || github.event.inputs.source == 'both'
        run: |
          echo "Running NYU Stern backfill (annual historical data)..."
          python scripts/backfill_spy_from_stern.py || echo "Stern backfill failed, continuing..."

      # Persist to the data branch (monthly, off-hours → ~0 collision).
      - name: Persist DB to data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SZ=$(stat -c%s "Stock Data.db" 2>/dev/null || echo 0)
          if [ "$SZ" -lt 10000000 ]; then echo "::error::DB only $SZ bytes — refusing to persist"; exit 1; fi
          ok=0
          for attempt in 1 2 3; do
            rm -rf dbpush
            git clone --depth 1 -b data \
              "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" dbpush
            cp "Stock Data.db" dbpush/
            cd dbpush
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "Stock Data.db"
            if git diff --cached --quiet; then echo "DB unchanged."; cd ..; ok=1; break; fi
            git commit -m "data: monthly SPY backfill"
            if git push origin HEAD:data; then cd ..; ok=1; break; fi
            echo "push raced (attempt $attempt) — retry"; cd ..; sleep 3
          done
          [ "$ok" = "1" ] || { echo "::error::could not persist backfill DB"; exit 1; }
