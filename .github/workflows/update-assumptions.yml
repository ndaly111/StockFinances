name: Update assumptions

# Triggered by update_form.html (unlisted) via GitHub REST API workflow_dispatch.
# Updates one ticker's growth rate and/or profit margin in Tickers_Info, opens
# a GitHub issue with the before/after diff (which auto-emails the repo owner),
# refreshes only that ticker's valuation chart + page (~30s) instead of the
# full 25-minute site refresh, and pushes everything — including the freshly
# rendered ticker page — to gh-pages.

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker symbol (e.g. AAPL)"
        required: true
        type: string
      growth_rate:
        description: "Nick's expected growth rate (%)"
        required: true
        type: string
      profit_margin:
        description: "Projected profit margin (%) — optional"
        required: false
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: update-assumptions-${{ inputs.ticker }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # Phase 1 Stage C: DB lives on the `data` branch. The main commit below
      # still pushes tickers.csv / assumptions.json / charts / pages to main
      # (the DB part of its `git add` is now a gitignore no-op); the DB itself
      # is persisted to `data` in a dedicated step.
      - name: Hydrate DB from data branch
        run: |
          git fetch --depth 1 origin data
          git restore --source=origin/data --worktree -- "Stock Data.db"
          test -s "Stock Data.db" || { echo "::error::DB hydrate failed/empty"; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Normalize inputs + capture previous values
        id: prev
        env:
          TICKER: ${{ inputs.ticker }}
          GROWTH_NEW: ${{ inputs.growth_rate }}
          MARGIN_NEW: ${{ inputs.profit_margin }}
        run: |
          python - <<'PY'
          import os, sqlite3, sys
          ticker = os.environ["TICKER"].strip().upper()
          if not ticker:
              sys.exit("ticker is empty")
          growth_new = os.environ["GROWTH_NEW"].strip()
          margin_new = os.environ.get("MARGIN_NEW", "").strip()

          con = sqlite3.connect("Stock Data.db")
          cur = con.execute(
              "SELECT nicks_growth_rate, projected_profit_margin "
              "FROM Tickers_Info WHERE ticker = ?",
              (ticker,),
          )
          row = cur.fetchone()
          con.close()
          # A brand-new ticker (e.g. a fresh IPO not yet in Tickers_Info) has no
          # prior values — treat them as empty and let update_tickers.py upsert
          # the row, rather than failing the whole run.
          growth_old, margin_old = row if row is not None else (None, None)

          def f(v):
              return "" if v is None else str(v)

          out = open(os.environ["GITHUB_OUTPUT"], "a")
          out.write(f"ticker={ticker}\n")
          out.write(f"growth_old={f(growth_old)}\n")
          out.write(f"growth_new={growth_new}\n")
          out.write(f"margin_old={f(margin_old)}\n")
          out.write(f"margin_new={margin_new}\n")
          out.close()
          PY

      - name: Apply update
        env:
          TICKER:        ${{ steps.prev.outputs.ticker }}
          GROWTH_NEW:    ${{ steps.prev.outputs.growth_new }}
          MARGIN_NEW:    ${{ steps.prev.outputs.margin_new }}
        run: |
          # update_tickers.py: action ticker [growth] [profit_margin]
          if [ -n "$MARGIN_NEW" ]; then
            python update_tickers.py update "$TICKER" "$GROWTH_NEW" "$MARGIN_NEW"
          else
            python update_tickers.py update "$TICKER" "$GROWTH_NEW"
          fi

      - name: Refresh data/assumptions.json
        run: python scripts/dump_assumptions.py

      - name: Per-ticker refresh (valuation chart + page)
        env:
          TICKER: ${{ steps.prev.outputs.ticker }}
        run: python scripts/refresh_one_ticker.py "$TICKER"

      - name: Commit & push to main
        id: commit
        env:
          TICKER:     ${{ steps.prev.outputs.ticker }}
          GROWTH_OLD: ${{ steps.prev.outputs.growth_old }}
          GROWTH_NEW: ${{ steps.prev.outputs.growth_new }}
          MARGIN_OLD: ${{ steps.prev.outputs.margin_old }}
          MARGIN_NEW: ${{ steps.prev.outputs.margin_new }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage everything the per-ticker refresh might have touched
          git add "Stock Data.db" tickers.csv data/assumptions.json \
                  "charts/${TICKER}_*" "pages/${TICKER}_page.html" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes — submitted values match what's already in the DB."
            echo "no_change=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MSG="Assumptions: $TICKER growth $GROWTH_OLD -> $GROWTH_NEW"
          if [ -n "$MARGIN_NEW" ]; then
            MSG="$MSG, margin $MARGIN_OLD -> $MARGIN_NEW"
          fi
          git commit -m "$MSG"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "no_change=false" >> "$GITHUB_OUTPUT"

      # Persist the Tickers_Info change to the data branch (rare manual dispatch
      # → ~0 collision; simple retry, fails loud rather than clobber).
      - name: Persist DB to data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TICKER: ${{ steps.prev.outputs.ticker }}
        run: |
          SZ=$(stat -c%s "Stock Data.db" 2>/dev/null || echo 0)
          if [ "$SZ" -lt 10000000 ]; then echo "::error::DB only $SZ bytes — refusing to persist"; exit 1; fi
          ok=0
          for attempt in 1 2 3; do
            rm -rf dbpush
            git clone --depth 1 -b data \
              "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" dbpush
            cp "Stock Data.db" dbpush/
            cd dbpush
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "Stock Data.db"
            if git diff --cached --quiet; then echo "DB unchanged."; cd ..; ok=1; break; fi
            git commit -m "data: assumptions update ($TICKER)"
            if git push origin HEAD:data; then cd ..; ok=1; break; fi
            echo "push raced (attempt $attempt) — retry"; cd ..; sleep 3
          done
          [ "$ok" = "1" ] || { echo "::error::could not persist assumptions DB"; exit 1; }

      # Don't use the existing repo's git for gh-pages — fetching that whole
      # branch's history is what blew the run out to ~7 minutes. Instead, a
      # depth-1 ref-specific clone of just gh-pages, dropping the deploy to
      # the network round-trip (≈10s).
      - name: Checkout gh-pages (shallow)
        if: steps.commit.outputs.no_change != 'true'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-deploy
          fetch-depth: 1
          persist-credentials: true

      - name: Deploy ticker artifacts to gh-pages
        if: steps.commit.outputs.no_change != 'true'
        env:
          TICKER: ${{ steps.prev.outputs.ticker }}
        working-directory: gh-pages-deploy
        run: |
          set -e
          mkdir -p charts pages data
          cp ../data/assumptions.json data/assumptions.json
          for f in ../charts/${TICKER}_*; do
            [ -e "$f" ] && cp "$f" charts/
          done
          [ -e "../pages/${TICKER}_page.html" ] && cp "../pages/${TICKER}_page.html" pages/

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/assumptions.json "charts/${TICKER}_*" "pages/${TICKER}_page.html" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "gh-pages already current for $TICKER."
          else
            git commit -m "deploy: refresh $TICKER after assumptions change"
            git push origin gh-pages
          fi

      - name: Open audit issue
        if: steps.commit.outputs.no_change != 'true'
        env:
          GH_TOKEN:   ${{ secrets.GITHUB_TOKEN }}
          TICKER:     ${{ steps.prev.outputs.ticker }}
          ACTOR:      ${{ github.actor }}
          SHA:        ${{ steps.commit.outputs.sha }}
          GROWTH_OLD: ${{ steps.prev.outputs.growth_old }}
          GROWTH_NEW: ${{ steps.prev.outputs.growth_new }}
          MARGIN_OLD: ${{ steps.prev.outputs.margin_old }}
          MARGIN_NEW: ${{ steps.prev.outputs.margin_new }}
        run: |
          BODY="**Ticker:** $TICKER
          **Triggered by:** @$ACTOR
          **Commit:** [\`${SHA:0:7}\`](https://github.com/${{ github.repository }}/commit/$SHA)

          | Field | Before | After |
          |---|---|---|
          | growth_rate | ${GROWTH_OLD:-_(unset)_} | $GROWTH_NEW |
          | profit_margin | ${MARGIN_OLD:-_(unset)_} | ${MARGIN_NEW:-_(unchanged)_} |

          Valuation chart + page were refreshed in-place and deployed to
          gh-pages (no full site refresh needed)."
          gh issue create \
            --title "Assumptions changed: $TICKER" \
            --body "$BODY" \
            --label "assumptions-change" 2>&1 || \
          gh issue create \
            --title "Assumptions changed: $TICKER" \
            --body "$BODY"
