name: Probe FMP history depth (one-off)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Run probe
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python scripts/probe_fmp_history_depth.py
