name: Refresh site (daily)

# Fast daily refresh: only the things that move day-to-day. Forward EPS /
# revenue estimates, current price, valuation chart, forecast charts, news,
# implied growth, forward-estimate-history snapshots, dashboard, market
# summary. Historical financials, balance sheet, segments, expense reports,
# EDGAR backfill, and the index-growth historical rebuilds are skipped —
# those are handled by site-refresh.yml on Sundays. Expected runtime ~5-8 min
# (was ~25 min for the full pipeline).

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * 1-5"    # 6:00 EST
    - cron: "0 15 * * 1-5"    # 10:00 EST
    - cron: "0 18 * * 1-5"    # 1:00 PM EST
    - cron: "30 21 * * 1-5"   # 4:30 PM EST

permissions:
  contents: write
  issues: write   # file/append a CI-failure issue (see last step)

concurrency:
  # Share the concurrency group with the weekly job so a Sunday weekly run
  # can't collide with a daily dispatch.
  group: site-refresh
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MODE: daily
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      SEC_EMAIL: ${{ secrets.EMAIL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate pages
        run: |
          python main_remote.py
          python generate_market_summary.py
          python scripts/dump_assumptions.py

      # Rebuild the per-ticker JSON the site shell (ticker.html) reads — once a
      # day on the morning run (the 0 11 UTC cron, ~6-7 AM ET) or on manual
      # dispatch. By morning the prior day's close is fully settled and any
      # overnight filings are in; main_remote above just refreshed the DB, so
      # this reads fresh data. The other 3 daily runs skip this and leave
      # ticker_data untouched (the rsync below excludes it), so they can't wipe it.
      - name: Generate ticker JSONs (morning)
        if: github.event.schedule == '0 11 * * 1-5' || github.event_name == 'workflow_dispatch'
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
          GEN_WORKERS: "1"
        run: |
          TICKERS=$(tail -n +2 tickers.csv | tr -d '\r' | tr '\n' ' ')
          # No "|| true": gen_ticker_json now exits nonzero if too many tickers
          # fail (GEN_FAIL_TOLERANCE), so a catastrophic build fails the step
          # instead of silently leaving ticker_data stale.
          python scripts/gen_ticker_json.py $TICKERS
          echo "built $(ls ticker_data/*.json 2>/dev/null | wc -l) ticker JSONs"

      - name: Check out gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 1

      - name: Copy site output into gh-pages
        run: |
          # Exclude artifacts owned by other workflows so this --delete
          # doesn't race-wipe them. The screen-microcaps workflow writes
          # microcaps.html + data/microcap_candidates*.csv directly to
          # gh-pages on Sundays; without these excludes the next daily
          # refresh would clobber them.
          rsync -av --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "gh-pages" \
            --exclude "microcaps.html" \
            --exclude "data/microcap_candidates*.csv" \
            --exclude "data/microcap_appearances.json" \
            --exclude "charts/microcap_thesis_*.png" \
            --exclude "charts/microcap/" \
            --exclude "ticker_data/" \
            ./ gh-pages/

      - name: Commit & push changes to gh-pages
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Deploy to GitHub Pages (daily)"
            git push origin gh-pages
          fi

      # Deploy the freshly-built ticker JSON separately from the rsync above
      # (which always excludes ticker_data/). Guarded: if the build produced too
      # few files, skip rather than let --delete wipe the live data.
      - name: Deploy ticker_data (morning)
        if: github.event.schedule == '0 11 * * 1-5' || github.event_name == 'workflow_dispatch'
        run: |
          COUNT=$(ls ticker_data/*.json 2>/dev/null | wc -l)
          echo "ticker_data files built: $COUNT"
          if [ "$COUNT" -lt 90 ]; then
            echo "Fewer than 90 JSONs built — skipping deploy to avoid wiping live data."
            exit 0
          fi
          mkdir -p gh-pages/ticker_data
          rsync -a --delete ticker_data/ gh-pages/ticker_data/
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # ticker_data/ is in .gitignore, so force-add (covers new tickers too);
          # tracked files update normally, gitignore only blocks untracked adds.
          git add -f ticker_data
          if git diff --cached --quiet; then
            echo "No ticker_data changes."
          else
            git commit -m "Deploy ticker_data (daily market close)"
            git push origin gh-pages
          fi

      # Surface failures: previously a broken run could go green (|| true +
      # the JSON generator never exited nonzero), which is how ME.json vanished
      # unnoticed. File one deduped issue per workflow; comment on re-failures.
      - name: File failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="CI failure: ${{ github.workflow }}"
          URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          N=$(gh issue list --state open --limit 100 --json number,title \
                --jq "[.[] | select(.title==\"$TITLE\")][0].number // empty")
          if [ -n "$N" ]; then
            gh issue comment "$N" --body "Failed again: $URL"
          else
            gh issue create --title "$TITLE" --body "Workflow failed: $URL"
          fi
