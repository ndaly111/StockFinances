name: Refresh site (daily)

# Fast daily refresh: only the things that move day-to-day. Forward EPS /
# revenue estimates, current price, valuation chart, forecast charts, news,
# implied growth, forward-estimate-history snapshots, dashboard, market
# summary. Historical financials, balance sheet, segments, expense reports,
# EDGAR backfill, and the index-growth historical rebuilds are skipped —
# those are handled by site-refresh.yml on Sundays. Expected runtime ~5-8 min
# (was ~25 min for the full pipeline).

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * 1-5"    # 6:00 EST
    - cron: "0 15 * * 1-5"    # 10:00 EST
    - cron: "0 18 * * 1-5"    # 1:00 PM EST
    - cron: "30 21 * * 1-5"   # 4:30 PM EST

permissions:
  contents: write
  issues: write   # file/append a CI-failure issue (see last step)

concurrency:
  # Share the concurrency group with the weekly job so a Sunday weekly run
  # can't collide with a daily dispatch.
  group: site-refresh
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MODE: daily
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      SEC_EMAIL: ${{ secrets.EMAIL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Phase 1 Stage A: read the DB from the orphan `data` branch (the proven
      # source of truth) rather than from main's tracked copy. git restore
      # --source writes the worktree without staging it, so it works even once
      # the DB is gitignored on main and can never be re-committed to main by a
      # `git add .`. The DB is still tracked on main today, so this is a safe,
      # reversible overwrite-with-equivalent-bytes. test -s guards an empty DB.
      - name: Hydrate DB from data branch
        run: |
          git fetch --depth 1 origin data
          git restore --source=origin/data --worktree -- "Stock Data.db"
          test -s "Stock Data.db" || { echo "::error::DB hydrate failed/empty"; exit 1; }
          echo "Hydrated Stock Data.db from data branch ($(stat -c%s 'Stock Data.db') bytes)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate pages
        run: |
          python main_remote.py
          python generate_market_summary.py
          python scripts/dump_assumptions.py

      # Collect the post-close SPY/QQQ index snapshot in the EVENING run, folded
      # in from daily_index_data.yml (whose schedule is retired) so there is a
      # SINGLE writer to the data branch at 21:30 — no cross-workflow push race.
      # main_remote already ran backfill_index_growth(); this adds the snapshot
      # tables (Daily_Index_Snapshots, Index_PE/EPS/Price history).
      - name: Collect daily index snapshot (evening)
        if: github.event.schedule == '30 21 * * 1-5' || github.event_name == 'workflow_dispatch'
        run: |
          python scripts/collect_daily_index_data.py --tickers SPY QQQ || echo "index collect failed, continuing"
          python backfill_index_growth.py || echo "backfill growth failed, continuing"

      # Rebuild the per-ticker JSON the site shell (ticker.html) reads — once a
      # day on the morning run (the 0 11 UTC cron, ~6-7 AM ET) or on manual
      # dispatch. By morning the prior day's close is fully settled and any
      # overnight filings are in; main_remote above just refreshed the DB, so
      # this reads fresh data. The other 3 daily runs skip this and leave
      # ticker_data untouched (the rsync below excludes it), so they can't wipe it.
      - name: Generate ticker JSONs (morning)
        if: github.event.schedule == '0 11 * * 1-5' || github.event_name == 'workflow_dispatch'
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
          # Re-enabled parallel after the companyfacts swap cut per-ticker
          # requests ~9x (62 -> ~7), so 4 workers no longer rate-limit yahoo
          # (the old 4/102 failure was at 62 req/ticker). The <90-build guard +
          # nonzero-exit make a rate-limit failure loud & non-deploying.
          GEN_WORKERS: "4"
        run: |
          TICKERS=$(tail -n +2 tickers.csv | tr -d '\r' | tr '\n' ' ')
          # No "|| true": gen_ticker_json now exits nonzero if too many tickers
          # fail (GEN_FAIL_TOLERANCE), so a catastrophic build fails the step
          # instead of silently leaving ticker_data stale.
          python scripts/gen_ticker_json.py $TICKERS
          echo "built $(ls ticker_data/*.json 2>/dev/null | wc -l) ticker JSONs"

      - name: Check out gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 1

      - name: Copy site output into gh-pages
        run: |
          # Exclude artifacts owned by other workflows so this --delete
          # doesn't race-wipe them. The screen-microcaps workflow writes
          # microcaps.html + data/microcap_candidates*.csv directly to
          # gh-pages on Sundays; without these excludes the next daily
          # refresh would clobber them.
          rsync -av --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "gh-pages" \
            --exclude "Stock Data.db" \
            --exclude "*.db-wal" --exclude "*.db-shm" --exclude "*.db-journal" \
            --exclude "microcaps.html" \
            --exclude "data/microcap_candidates*.csv" \
            --exclude "data/microcap_appearances.json" \
            --exclude "charts/microcap_thesis_*.png" \
            --exclude "charts/microcap/" \
            --exclude "ticker_data/" \
            ./ gh-pages/

      - name: Commit & push changes to gh-pages
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # One-time: drop the stale 22MB DB from gh-pages (the site never serves
          # it). rsync now excludes it, so this deletion isn't re-added. rm -f +
          # git add -A stages the removal; idempotent on later runs.
          rm -f "Stock Data.db"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Deploy to GitHub Pages (daily)"
            git push origin gh-pages
          fi

      # Deploy the freshly-built ticker JSON separately from the rsync above
      # (which always excludes ticker_data/). Guarded: if the build produced too
      # few files, skip rather than let --delete wipe the live data.
      - name: Deploy ticker_data (morning)
        if: github.event.schedule == '0 11 * * 1-5' || github.event_name == 'workflow_dispatch'
        run: |
          COUNT=$(ls ticker_data/*.json 2>/dev/null | wc -l)
          echo "ticker_data files built: $COUNT"
          if [ "$COUNT" -lt 90 ]; then
            echo "Fewer than 90 JSONs built — skipping deploy to avoid wiping live data."
            exit 0
          fi
          mkdir -p gh-pages/ticker_data
          rsync -a --delete ticker_data/ gh-pages/ticker_data/
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # ticker_data/ is in .gitignore, so force-add (covers new tickers too);
          # tracked files update normally, gitignore only blocks untracked adds.
          git add -f ticker_data
          if git diff --cached --quiet; then
            echo "No ticker_data changes."
          else
            git commit -m "Deploy ticker_data (daily market close)"
            git push origin gh-pages
          fi

      # --- Persist DB to the data branch (Phase 1 Stage B) ---
      # Now MANDATORY (no continue-on-error) and runs on EVERY daily refresh.
      # The <10MB guard fails loudly (a tiny DB means main_remote produced a
      # broken DB). Retry loop covers a transient/raced push. NOTE: in Stage B
      # the only data-branch writers are the daily+weekly refresh runs, which
      # never run concurrently, so re-cloning and re-pushing OUR DB is safe.
      # When Stage C adds the index/assumptions writers (DISJOINT tables), the
      # losing side must RE-RUN its writer on the new tip rather than clobber —
      # that handling lands in Stage C.
      - name: Persist DB to data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SZ=$(stat -c%s "Stock Data.db" 2>/dev/null || echo 0)
          if [ "$SZ" -lt 10000000 ]; then
            echo "::error::Stock Data.db is only $SZ bytes (<10MB) — refusing to persist."
            exit 1
          fi
          ok=0
          for attempt in 1 2 3 4 5; do
            rm -rf dbpush
            git clone --depth 1 -b data \
              "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" dbpush
            cp "Stock Data.db" dbpush/
            cd dbpush
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "Stock Data.db"
            if git diff --cached --quiet; then
              echo "DB unchanged — nothing to persist."; cd ..; ok=1; break
            fi
            git commit -m "db: daily refresh"
            if git push origin HEAD:data; then cd ..; ok=1; break; fi
            echo "push raced (attempt $attempt) — re-clone & retry"; cd ..
          done
          [ "$ok" = "1" ] || { echo "::error::could not persist DB after 5 attempts"; exit 1; }

      # Surface failures: previously a broken run could go green (|| true +
      # the JSON generator never exited nonzero), which is how ME.json vanished
      # unnoticed. File one deduped issue per workflow; comment on re-failures.
      - name: File failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="CI failure: ${{ github.workflow }}"
          URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          N=$(gh issue list --state open --limit 100 --json number,title \
                --jq "[.[] | select(.title==\"$TITLE\")][0].number // empty")
          if [ -n "$N" ]; then
            gh issue comment "$N" --body "Failed again: $URL"
          else
            gh issue create --title "$TITLE" --body "Workflow failed: $URL"
          fi
