name: Backfill forward revenue history

# One-shot: walks git history of Stock Data.db, pulls ForwardRevenue from each
# daily snapshot, and fills in forward_revenue / revenue_analysts on the
# matching Forward_EPS_FY_History rows. Run once to seed the revenue chart
# with the same depth of history as the EPS chart.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backfill-revenue-history
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Run backfill
        run: python scripts/backfill_forward_revenue_history.py

      - name: Commit & push updated DB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Stock Data.db"
          if git diff --cached --quiet; then
            echo "No DB changes from backfill (nothing to push)."
          else
            git commit -m "data: backfill forward revenue history from git snapshots"
            git push
          fi
