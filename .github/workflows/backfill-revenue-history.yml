name: Backfill forward revenue history

# One-shot: walks git history of Stock Data.db, pulls ForwardRevenue from each
# daily snapshot, and fills in forward_revenue / revenue_analysts on the
# matching Forward_EPS_FY_History rows. Run once to seed the revenue chart
# with the same depth of history as the EPS chart.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backfill-revenue-history
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # Phase 1 Stage C: DB lives on the `data` branch. NOTE: this is a completed
      # one-shot that also mined the DB's *main git history* (now gone) — it is
      # effectively dead post-flip and slated for deletion; hydrate + the guarded
      # add below just keep a stray dispatch from going RED.
      - name: Hydrate DB from data branch
        run: |
          git fetch --depth 1 origin data
          git restore --source=origin/data --worktree -- "Stock Data.db"
          test -s "Stock Data.db" || { echo "::error::DB hydrate failed/empty"; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Run backfill
        run: python scripts/backfill_forward_revenue_history.py

      - name: Commit & push updated DB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # DB is gitignored on main now → this add is a no-op (|| true keeps the
          # step from dying under bash -eo pipefail). The DB is not persisted from
          # this dead one-shot.
          git add "Stock Data.db" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No DB changes from backfill (nothing to push)."
          else
            git commit -m "data: backfill forward revenue history from git snapshots"
            git push
          fi
